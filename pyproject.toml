[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2wxr"
version = "0.1.0"
description = "Convert Markdown files to WordPress WXR export XML"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.9"
authors = [
    {name = "Lalatendu Mohanty"},
]
keywords = ["markdown", "wordpress", "wxr", "export", "import", "xml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "markdown>=3.4",
]

[project.scripts]
md2wxr = "md2wxr.cli:main"

[project.urls]
Homepage = "https://github.com/LalatenduMohanty/md2wxr"
Repository = "https://github.com/LalatenduMohanty/md2wxr"
Issues = "https://github.com/LalatenduMohanty/md2wxr/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/md2wxr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
