[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "md2wxr"
version = "0.1.0"
description = "Convert Markdown files to WordPress WXR export XML"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    {name = "Lalatendu Mohanty"},
]
keywords = ["markdown", "wordpress", "wxr", "export", "import", "xml"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Text Processing :: Markup :: XML",
]
dependencies = [
    "markdown>=3.4",
]

[project.scripts]
md2wxr = "md2wxr.cli:main"

[project.urls]
Homepage = "https://github.com/LalatenduMohanty/md2wxr"
Repository = "https://github.com/LalatenduMohanty/md2wxr"
Issues = "https://github.com/LalatenduMohanty/md2wxr/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/md2wxr"]

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pytest>=7.0",
    "ruff>=0.4",
    "types-Markdown>=3.6",
]

[tool.hatch.envs.dev]
dependencies = [
    "mypy>=1.10",
    "pytest>=7.0",
    "ruff>=0.4",
    "types-Markdown>=3.6",
]

[tool.hatch.envs.dev.scripts]
lint = "ruff check src/ tests/"
format = "ruff format src/ tests/"
format-check = "ruff format --check src/ tests/"
typecheck = "mypy src/"
test = "pytest {args}"
check = ["lint", "format-check", "typecheck", "test"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]

[tool.ruff.lint.per-file-ignores]
"src/md2wxr/wxr.py" = ["E501"]  # XML template has long comment lines

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
